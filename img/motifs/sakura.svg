<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="600" viewBox="0 0 600 600">
  <!-- Background tile for the light theme (css/site.css): cherry blossoms and loose falling petals,
       scattered so the repeat is hard to spot. Everything sits fully inside the tile. -->
  <defs>
    <!-- one petal, pointing up from the centre of the flower, with the notch at its tip -->
    <path id="p" d="M0 -4C-13 -12 -17 -29 -9 -41L0 -35L9 -41C17 -29 13 -12 0 -4Z"/>
    <g id="b">
      <g fill="#e7a3ae">
        <use xlink:href="#p" href="#p"/>
        <use xlink:href="#p" href="#p" transform="rotate(72)"/>
        <use xlink:href="#p" href="#p" transform="rotate(144)"/>
        <use xlink:href="#p" href="#p" transform="rotate(216)"/>
        <use xlink:href="#p" href="#p" transform="rotate(288)"/>
      </g>
      <circle r="7" fill="#c9566a"/>
      <g fill="#b3443d">
        <circle cx="0" cy="-12" r="1.8"/><circle cx="11.4" cy="-3.7" r="1.8"/><circle cx="7" cy="9.7" r="1.8"/>
        <circle cx="-7" cy="9.7" r="1.8"/><circle cx="-11.4" cy="-3.7" r="1.8"/>
      </g>
    </g>
    <use id="l" xlink:href="#p" href="#p" fill="#e7a3ae"/>
  </defs>
  <!-- blossoms -->
  <use xlink:href="#b" href="#b" transform="translate(90 100) rotate(10) scale(1.1)"/>
  <use xlink:href="#b" href="#b" transform="translate(330 70) rotate(-20) scale(0.7)"/>
  <use xlink:href="#b" href="#b" transform="translate(490 230) rotate(35) scale(1.25)"/>
  <use xlink:href="#b" href="#b" transform="translate(230 300) rotate(-5) scale(0.85)"/>
  <use xlink:href="#b" href="#b" transform="translate(80 470) rotate(25) scale(0.65)"/>
  <use xlink:href="#b" href="#b" transform="translate(400 480) rotate(-30) scale(1)"/>
  <!-- loose petals -->
  <use xlink:href="#l" href="#l" transform="translate(200 150) rotate(130) scale(0.55)"/>
  <use xlink:href="#l" href="#l" transform="translate(420 150) rotate(-60) scale(0.45)"/>
  <use xlink:href="#l" href="#l" transform="translate(110 290) rotate(200) scale(0.5)"/>
  <use xlink:href="#l" href="#l" transform="translate(350 360) rotate(80) scale(0.4)"/>
  <use xlink:href="#l" href="#l" transform="translate(560 380) rotate(-140) scale(0.5)"/>
  <use xlink:href="#l" href="#l" transform="translate(250 540) rotate(40) scale(0.45)"/>
  <use xlink:href="#l" href="#l" transform="translate(530 560) rotate(160) scale(0.35)"/>
  <use xlink:href="#l" href="#l" transform="translate(40 230) rotate(-100) scale(0.35)"/>
</svg>
