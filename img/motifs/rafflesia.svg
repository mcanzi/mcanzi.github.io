      <g fill="#e4e7d8" stroke="#0b0b0a" stroke-width="1.3"><circle cx="17.5" cy="0" r="2.4"/><circle cx="15.2" cy="8.7" r="2.4"/><circle cx="8.8" cy="15.2" r="2.4"/><circle cx="0" cy="17.5" r="2.4"/><circle cx="-8.7" cy="15.2" r="2.4"/><circle cx="-15.2" cy="8.7" r="2.4"/><circle cx="-17.5" cy="0" r="2.4"/><circle cx="-15.2" cy="-8.8" r="2.4"/><circle cx="-8.8" cy="-15.2" r="2.4"/><circle cx="-0" cy="-17.5" r="2.4"/><circle cx="8.8" cy="-15.2" r="2.4"/><circle cx="15.2" cy="-8.8" r="2.4"/></g>
