        <path fill="none" stroke="#0b0b0a" stroke-width="2.2" d="M-24.9 -31.1Q-23.4 -35.1 -19.1 -34.9M-19.2 -29.5Q-17 -33.2 -12.8 -32.3M-13.4 -28.9Q-10.6 -32.2 -6.6 -30.7M-7.5 -27.4Q-4.3 -30.3 -0.5 -28.2M-1.5 -27.4Q2.1 -29.7 5.5 -27.1M4.6 -30.6Q8.5 -32.3 11.4 -29.1M10.7 -32.7Q14.9 -33.8 17.3 -30.2M17 -33.1Q21.2 -33.5 23 -29.6M-25 -43.3Q-23.3 -39.3 -26.6 -36.5M25 -43.3Q23.3 -39.3 26.6 -36.5M-24 -47.7Q-22.6 -43.6 -26 -41M24 -47.7Q22.6 -43.6 26 -41M-22.3 -52.3Q-21.2 -48.1 -24.7 -45.7M22.3 -52.3Q21.2 -48.1 24.7 -45.7M-20 -56.9Q-19.1 -52.7 -22.8 -50.5M20 -56.9Q19.1 -52.7 22.8 -50.5"/>
      </g>
      <g fill="#e4e7d8" stroke="#0b0b0a" stroke-width="1.5"><ellipse cx="0" cy="-56" rx="4.5" ry="3.3"/><ellipse cx="-14" cy="-50" rx="3.6" ry="2.8"/><ellipse cx="14" cy="-50" rx="3.6" ry="2.8"/><ellipse cx="-7" cy="-42" rx="4" ry="3"/><ellipse cx="8" cy="-42" rx="4" ry="3"/><ellipse cx="-20" cy="-42" rx="2.8" ry="2.2"/><ellipse cx="20" cy="-42" rx="2.8" ry="2.2"/><ellipse cx="0" cy="-33" rx="3.2" ry="2.4"/></g>
