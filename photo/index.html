<dialog class="lightbox" aria-label="photo viewer">
  <button class="lb-close" aria-label="close">×</button>
  <button class="lb-prev" aria-label="previous photo">‹</button>
  <img alt="">
  <button class="lb-next" aria-label="next photo">›</button>
  <p class="lb-caption"><strong></strong><span class="mono"></span></p>
</dialog>

<script>
(() => {
  const items = [...document.querySelectorAll(".gallery-item")];
  const box = document.querySelector(".lightbox");
  if (!box || !items.length || !box.showModal) return;
  const img = box.querySelector("img");
  const cap = box.querySelector(".lb-caption strong");
  const gear = box.querySelector(".lb-caption span");
  let i = 0;
  const show = (k) => {
    i = (k + items.length) % items.length;
    const it = items[i];
    img.src = it.dataset.full;
    img.alt = it.dataset.caption;
    cap.textContent = it.dataset.caption;
    gear.textContent = it.dataset.gear;
  };
  items.forEach((it, k) => it.addEventListener("click", () => { show(k); box.showModal(); }));
  box.querySelector(".lb-close").addEventListener("click", () => box.close());
  box.querySelector(".lb-prev").addEventListener("click", () => show(i - 1));
  box.querySelector(".lb-next").addEventListener("click", () => show(i + 1));
  box.addEventListener("click", (e) => { if (e.target === box) box.close(); });
  document.addEventListener("keydown", (e) => {
    if (!box.open) return;
    if (e.key === "ArrowRight") show(i + 1);
    if (e.key === "ArrowLeft") show(i - 1);
  });
})();
</script>
